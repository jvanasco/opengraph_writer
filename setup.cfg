[metadata]
name = opengraph_writer
version = attr: opengraph_writer.__VERSION__
url = https://github.com/jvanasco/opengraph_writer
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
description = Lightweight OpenGraph support for writing and validating objects.
long_description = file: README.md
long_description_content_type = text/markdown
keywords = facebook opengraph open graph web pyramid
license = MIT
license_file = LICENSE.txt
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
zip_safe = False
include_package_data = True
install_requires =
    metadata_utils>=0.2.0
    setuptools<82; python_version >= "3.7" and python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
opengraph_writer = py.typed

[options.extras_require]
testing =
    pytest
    pyramid
    setuptools<82

[flake8]
per-file-ignores =
    src/opengraph_writer/__init__.py: E501
    tests/test_core.py: E501
    tests/test_pyramid_integration.py: E501
exclude = .eggs/*, .pytest_cache/*, .tox/*, build/*, dist/*
application_import_names = opengraph_writer
import_order_style = appnexus

[tox:tox]
envlist = py36,py37,py38,py39,py310,py311,py312,py313,py314,py315
isolated_build = true

[testenv]
package = wheel
extras = testing
deps = coverage
commands =
    python -m coverage run --source=opengraph_writer -m pytest {posargs:}
    python -m coverage html

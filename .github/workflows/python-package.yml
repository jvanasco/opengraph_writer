name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.6"
            image: python:3.6.15-bullseye
          - python-version: "3.7"
            image: python:3.7.17-bullseye
          - python-version: "3.8"
          - python-version: "3.9"
          - python-version: "3.10"
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
          - python-version: "3.15"
            prerelease: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.prerelease || false }}
      - name: Test on the hosted runner
        if: ${{ !matrix.image }}
        run: |
          python -m pip install tox
          python -m tox -e py
      - name: Test in the official Python image
        if: ${{ matrix.image }}
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --volume "$PWD:/checkout" --workdir /checkout "$PYTHON_IMAGE" \
            sh -ec 'python -m pip install "tox<4" && python -m tox -e py'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: error
